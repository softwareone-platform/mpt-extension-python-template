[project]
name = "mpt-extension-python-template"
version = "6.0.0"
description = "Template repository for SoftwareOne Marketplace extensions."
authors = [{ name = "SoftwareOne AG" }]
requires-python = ">=3.12,<4"
license = { text = "Apache-2.0 license" }
dependencies = [
    "mpt-extension-contrib-order-status==1.0.*",
    "mpt-extension-sdk==6.8.*",
    "mpt-tool==6.0.*",
]

[dependency-groups]
dev = [
  "flake8==7.4.*",
  "flake8-aaa==0.17.*",
  "flake8-pyproject==1.2.*",
  "mypy==2.4.*",
  "pre-commit==4.7.*",
  "pytest-asyncio==1.4.*",
  "pytest-cov==7.1.*",
  "pytest-deadfixtures==3.1.*",
  "pytest-mock==3.17.*",
  "pytest-randomly==5.0.*",
  "pytest-xdist==3.8.*",
  "ruff==0.17.*", # force ruff version to have same formatting everywhere, also update in pre-commit config
  "wemake-python-styleguide==1.8.*",   # also update pre-commit config
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mpt_extension_python_template"]

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = "."
addopts = "--cov=mpt_extension_python_template --cov-report=term-missing --cov-report=xml  --import-mode=importlib"
log_cli = false
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
relative_files = true
branch = true
omit = [
  "**/__init__.py"
]

[tool.flake8]
allowed-domain-names = ["result"]
aaa_act_block_style = "large"
doctests = true
extend-ignore = ["WPS226"]
extend-exclude = [
  ".coverage",
  ".github",
  ".idea",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "uv.lock",
  ".venv",
]
format = "wemake"
max-imports = 17
max-line-length = 100
select = ["AAA", "E999", "WPS"]
show-source = true
statistics = false
per-file-ignores = [
  # The leading `*` makes this match both CI (`migrations/...`) and pre-commit (`backend/migrations/...`) paths.
  "*migrations/**:WPS102",
  "*tests/**:WPS202",
]

[tool.ruff]
preview = true
target-version = "py312"
output-format = "full"
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "C90",
  "COM",
  "D",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "debugger",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "stdlib-module-shadowing",
  "raise-without-from-inside-except",
  "missing-trailing-comma",
  "undocumented-public-module",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "incorrect-blank-line-before-class",
  "multi-line-summary-first-line",
  "non-imperative-mood",
  "docstring-starts-with-this",
  "non-capitalized-section-name",
  "single-line-implicit-string-concatenation",
  "explicit-string-concatenation",
  "PLR09",
  "magic-value-comparison",
  "no-self-use",
  "pytest-raises-too-broad",
  "raise-vanilla-args",
]
external = ["AAA", "WPS"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["ast", "datetime"]
aliases = { datetime = "dt" }

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["property"]

[tool.ruff.lint.isort]
known-first-party = ["mpt_extension_python_template"]
known-third-party = ["mpt_extension_sdk"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "undocumented-public-class", # missing docstring in public class
  "undocumented-public-method", # missing docstring in public method
  "undocumented-public-function", # missing docstring in public function
  "pytest-raises-too-broad", # pytest.raises({exception}) is too broad, set the match parameter or use a more specific exception
  "assert", # asserts
  "hardcoded-password-string", # hardcoded passwords
  "suspicious-subprocess-import", # subprocess calls are for tests
  "subprocess-without-shell-equals-true", # do not require `shell=True`
  "start-process-with-partial-path", # partial executable paths
]

[tool.mypy]
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "mutable-override",
  "unimported-reveal",
  "deprecated",
]
exclude = ["tests"]
exclude_gitignore = true
ignore_missing_imports = true
local_partial_types = true
strict = true
warn_unreachable = true
